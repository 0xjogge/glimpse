name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      download-models:
        description: Download Japanese and verify translation with networking disabled
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      download-models: ${{ github.event_name == 'workflow_dispatch' && inputs.download-models }}
