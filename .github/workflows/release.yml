name: Release
on:
  push:
    tags: ["*.*-release"]
permissions:
  contents: read
concurrency:
  group: releases
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py "$RELEASE_TAG" --published >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    uses: ./.github/workflows/verify.yml
    with:
      download-models: true
  publish:
    name: Sign, inspect and publish five APKs
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-read-only: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run release:notes -- "$RELEASE_TAG" "$RELEASE_TAG" "$PREVIOUS_TAG"
      - name: Restore signing key
        env:
          GLIMPSE_KEYSTORE_BASE64: ${{ secrets.GLIMPSE_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key = os.environ["GLIMPSE_KEYSTORE_BASE64"]
          if not key:
              raise SystemExit("GLIMPSE_KEYSTORE_BASE64 is missing")
          path = Path(os.environ["RUNNER_TEMP"]) / "glimpse-release.p12"
          path.write_bytes(base64.b64decode(key, validate=True))
          path.chmod(0o600)
          PY
      - name: Build signed optimized APKs
        env:
          GLIMPSE_KEYSTORE_PATH: ${{ runner.temp }}/glimpse-release.p12
          GLIMPSE_KEYSTORE_PASSWORD: ${{ secrets.GLIMPSE_KEYSTORE_PASSWORD }}
          GLIMPSE_KEY_ALIAS: ${{ secrets.GLIMPSE_KEY_ALIAS }}
          GLIMPSE_KEY_PASSWORD: ${{ secrets.GLIMPSE_KEY_PASSWORD }}
        run: ./gradlew --stacktrace :app:assembleRelease -PglimpseVersion="$RELEASE_VERSION" -PglimpseSplitApks=true
      - run: python3 scripts/package-release.py "$RELEASE_TAG" --notes-file build/release-notes.md
      - name: Enable KVM for optimized APK smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the signed optimized APK before publishing
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 scripts/smoke-release.py "build/release/glimpse-$RELEASE_TAG-x86_64.apk"
      - name: Attach all assets to a draft, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/release-draft")" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file build/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" build/release/*.apk --clobber
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file build/release-notes.md --draft=false --prerelease=false --latest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: optimized-release-smoke
          path: build/reports/release-smoke/
          retention-days: 7
      - name: Remove signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/glimpse-release.p12"
